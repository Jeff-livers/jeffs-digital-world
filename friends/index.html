<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Jeff's Friends</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #FFFEFC;
      color: #000000;
      font-family: 'Roboto Mono', monospace;
      min-height: 100vh;
      padding: 48px 24px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    .back-link {
      display: inline-block;
      color: #000000;
      text-decoration: none;
      font-size: 0.875rem;
      margin-bottom: 40px;
      opacity: 0.5;
    }

    .back-link:hover {
      opacity: 1;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5.5rem);
      font-weight: 700;
      line-height: 1.05;
      margin-bottom: 16px;
      text-align: center;
    }

    .subtitle {
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 48px;
      text-align: center;
      color: #555555;
    }

    .friends {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .friend-card {
      background: #F3F3F4;
      border-radius: 20px;
      color: #000000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .friend-card:hover {
      background: #001F69;
      color: #ffffff;
      transform: translateY(-3px);
    }

    .friend-thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      object-position: top;
      display: block;
      background: #E8E8E8;
    }

    .friend-info {
      padding: 16px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .friend-name {
      font-size: 0.9rem;
      font-weight: 700;
    }

    .friend-domain {
      font-size: 0.75rem;
      opacity: 0.65;
      word-break: break-all;
    }

    @media (max-width: 540px) {
      .friends {
        grid-template-columns: 1fr;
      }

      body {
        padding: 32px 16px;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <a class="back-link" href="/">← back</a>

    <h1>My Friends</h1>
    <p class="subtitle">friends' corners of the internet</p>

    <div class="friends" id="friends"></div>

  </div>

  <script>
    fetch('friends.json')
      .then(res => res.json())
      .then(friends => {
        const container = document.getElementById('friends');
        friends.forEach(friend => {
          const a = document.createElement('a');
          a.className = 'friend-card';
          a.href = friend.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';

          const domain = friend.url
            .replace(/^https?:\/\//, '')
            .replace(/^www\./, '')
            .replace(/\/$/, '');

          const shot = `https://s.wordpress.com/mshots/v1/${encodeURIComponent(friend.url)}?w=800`;

          a.innerHTML = `
            <img class="friend-thumbnail" src="${shot}" alt="${friend.name}" loading="lazy">
            <div class="friend-info">
              <div class="friend-name">${friend.name}</div>
              <div class="friend-domain">${domain}</div>
            </div>
          `;
          container.appendChild(a);
        });
      });
  </script>

</body>
</html>
